  <script>
    const menuToggle=document.querySelector('.menu-toggle');const mobileMenu=document.querySelector('.mobile-menu');menuToggle.addEventListener('click',()=>{const isOpen=menuToggle.getAttribute('aria-expanded')==='true';menuToggle.setAttribute('aria-expanded',String(!isOpen));mobileMenu.classList.toggle('open',!isOpen);});document.querySelectorAll('.mobile-menu a').forEach(link=>link.addEventListener('click',()=>{menuToggle.setAttribute('aria-expanded','false');mobileMenu.classList.remove('open');}));const observer=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting)entry.target.classList.add('visible');}),{threshold:.08});document.querySelectorAll('.reveal').forEach(element=>observer.observe(element));const items=[...document.querySelectorAll('.gallery-item')];const lightbox=document.querySelector('#lightbox');const lightboxImage=document.querySelector('.lightbox-image');const closeButton=document.querySelector('.lightbox-close');const previousButton=document.querySelector('.lightbox-prev');const nextButton=document.querySelector('.lightbox-next');let currentIndex=0;let lastFocused=null;function showImage(index){currentIndex=(index+items.length)%items.length;const item=items[currentIndex];lightboxImage.src=item.dataset.image;lightboxImage.alt=item.querySelector('img').alt;}function openLightbox(index){lastFocused=document.activeElement;showImage(index);lightbox.classList.add('open');lightbox.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';closeButton.focus();}function closeLightbox(){lightbox.classList.remove('open');lightbox.setAttribute('aria-hidden','true');document.body.style.overflow='';if(lastFocused)lastFocused.focus();}items.forEach((item,index)=>item.addEventListener('click',()=>openLightbox(index)));closeButton.addEventListener('click',closeLightbox);previousButton.addEventListener('click',()=>showImage(currentIndex-1));nextButton.addEventListener('click',()=>showImage(currentIndex+1));lightbox.addEventListener('click',event=>{if(event.target===lightbox)closeLightbox();});document.addEventListener('keydown',event=>{if(!lightbox.classList.contains('open'))return;if(event.key==='Escape')closeLightbox();if(event.key==='ArrowLeft')showImage(currentIndex-1);if(event.key==='ArrowRight')showImage(currentIndex+1);});const dustLayer=document.querySelector('.gold-dust-layer');const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;if(!reducedMotion&&window.matchMedia('(pointer: fine)').matches){let previousX=null,previousY=null,lastDust=0;function makeDust(x,y,quantity){for(let i=0;i<quantity;i++){const dust=document.createElement('span');dust.className='gold-dust';const size=2+Math.random()*3.2,angle=Math.random()*Math.PI*2,distance=7+Math.random()*32,driftX=Math.cos(angle)*distance,driftY=Math.sin(angle)*distance-5-Math.random()*14;dust.style.width=size+'px';dust.style.height=size+'px';dust.style.left=(x+(Math.random()-.5)*11)+'px';dust.style.top=(y+(Math.random()-.5)*11)+'px';dust.style.opacity=(.66+Math.random()*.3).toFixed(2);dustLayer.appendChild(dust);requestAnimationFrame(()=>{dust.style.transition='transform 920ms cubic-bezier(.16,.84,.35,1), opacity 920ms ease';dust.style.transform=`translate(calc(-50% + ${driftX}px), calc(-50% + ${driftY}px)) scale(${.7+Math.random()*.9})`;dust.style.opacity='0';});window.setTimeout(()=>dust.remove(),960);}}document.addEventListener('pointermove',event=>{if(event.pointerType&&event.pointerType!=='mouse')return;const now=performance.now();if(previousX!==null){const dx=event.clientX-previousX,dy=event.clientY-previousY,distance=Math.hypot(dx,dy),steps=Math.max(1,Math.ceil(distance/10));if(now-lastDust>13||distance>3){for(let step=0;step<=steps;step++){const progress=step/steps;makeDust(previousX+dx*progress,previousY+dy*progress,2+Math.floor(Math.random()*2));}lastDust=now;}}else{makeDust(event.clientX,event.clientY,4);}previousX=event.clientX;previousY=event.clientY;},{passive:true});}
  </script>
