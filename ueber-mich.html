<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Erfahre mehr über sasatrumua – Make-up Artist und Hairstylist für Brautstyling, Film und Fernsehen.">
  <title>Über mich | sasatrumua</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink: #292522;
      --muted: #71675f;
      --gold: #b58a43;
      --line: rgba(99, 77, 49, .15);
      --clean: "DM Sans", Arial, sans-serif;
      --script: "Alex Brush", cursive;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      font-family: var(--clean);
      background-color: #f3eee7;
      background-image:
        linear-gradient(rgba(248, 245, 240, .18), rgba(248, 245, 240, .18)),
        url("https://github.com/Sasatrumua/sasatrumua.github.io/blob/main/Marmor.png?raw=true");
      background-repeat: no-repeat, no-repeat;
      background-position: center top, center top;
      background-size: cover, 100% 100%;
      background-attachment: fixed, fixed;
    }

    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    .container {
      width: min(calc(100% - 64px), 1180px);
      margin: 0 auto;
    }

    .site-header {
      width: 100%;
      padding: 14px 0 11px;
      text-align: center;
      background: rgba(250, 248, 244, .28);
    }

    .header-inner {
      width: min(calc(100% - 64px), 1440px);
      margin: 0 auto;
    }

    .logo {
      width: 116px;
      margin: 0 auto 5px;
    }

    .desktop-nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 19px;
      padding: 3px 0 8px;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .desktop-nav a {
      position: relative;
      padding: 4px 0;
      white-space: nowrap;
    }

    .desktop-nav a::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 0;
      height: 1px;
      background: var(--gold);
      transform: translateX(-50%);
      transition: width .24s ease;
    }

    .desktop-nav a:hover::after,
    .desktop-nav a:focus-visible::after,
    .desktop-nav a[aria-current="page"]::after { width: 100%; }

    .menu-toggle,
    .mobile-menu { display: none; }

    main { padding: 70px 0 84px; }

    .page-intro {
      margin-bottom: 37px;
      text-align: center;
    }

    .page-intro h1 {
      margin: 0;
      color: var(--ink);
      font-family: var(--script);
      font-size: clamp(58px, 6.2vw, 88px);
      font-weight: 400;
      line-height: .85;
    }

    .page-intro::after {
      content: "";
      display: block;
      width: 54px;
      height: 1px;
      margin: 22px auto 0;
      background: var(--gold);
    }

    .about-photo {
      width: min(100%, 590px);
      aspect-ratio: 4 / 5;
      margin: 0 auto 48px;
      overflow: hidden;
      background: #d8cec4;
      box-shadow: 0 14px 38px rgba(82, 61, 39, .10);
    }

    .about-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
    }

    .about-copy {
      max-width: 785px;
      margin: 0 auto;
      text-align: center;
    }

    .about-copy p {
      margin: 0 0 25px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 300;
      letter-spacing: .018em;
      line-height: 1.95;
    }

    .about-copy p:last-child { margin-bottom: 0; }

    .about-copy .highlight {
      margin: 3px auto 31px;
      color: var(--ink);
      font-family: var(--script);
      font-size: clamp(34px, 3.3vw, 50px);
      font-weight: 400;
      line-height: 1.05;
    }

    .about-copy .wedding-quote {
      max-width: 670px;
      margin: 34px auto 0;
      padding-top: 31px;
      border-top: 1px solid var(--line);
      color: var(--ink);
      font-family: var(--script);
      font-size: clamp(35px, 3.5vw, 52px);
      font-weight: 400;
      line-height: 1.1;
    }

    .about-copy .brands {
      max-width: 720px;
      margin-top: 35px;
      padding-top: 28px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      letter-spacing: .025em;
    }

    footer {
      width: min(calc(100% - 64px), 1180px);
      margin: 0 auto;
      padding: 28px 0 23px;
      border-top: 1px solid var(--line);
      text-align: center;
      color: var(--muted);
      font-size: 10px;
      font-weight: 400;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 13px;
      margin: 12px 0;
    }

    .reveal {
      opacity: 0;
      transform: translateY(22px);
      transition: opacity .76s ease, transform .76s ease;
    }

    .reveal.visible {
      opacity: 1;
      transform: none;
    }

    .gold-dust-layer {
      position: fixed;
      inset: 0;
      z-index: 999;
      overflow: hidden;
      pointer-events: none;
    }

    .gold-dust {
      position: fixed;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(circle, rgba(255,255,255,1) 0 16%, rgba(255,234,183,1) 28%, rgba(211,164,78,.95) 60%, rgba(177,124,45,0) 79%);
      box-shadow: 0 0 3px rgba(255,247,221,.98), 0 0 8px rgba(213,165,79,.65);
      transform: translate(-50%, -50%) scale(.2);
      will-change: transform, opacity;
    }

    @media (max-width: 920px) {
      .header-inner,
      .container,
      footer { width: min(calc(100% - 34px), 760px); }
      .about-photo { width: min(100%, 540px); }
    }

    @media (max-width: 620px) {
      .header-inner,
      .container,
      footer { width: min(calc(100% - 28px), 1440px); }

      body {
        background-image:
          linear-gradient(rgba(248, 245, 240, .03), rgba(248, 245, 240, .03)),
          url("https://github.com/Sasatrumua/sasatrumua.github.io/blob/main/Marmor.png?raw=true");
        background-repeat: no-repeat, no-repeat;
        background-position: center top, center top;
        background-size: cover, auto auto;
        background-attachment: scroll, scroll;
      }

      .site-header { padding-top: 12px; background: transparent; }
      .logo { width: 102px; margin-bottom: 0; }
      .desktop-nav { display: none; }

      .menu-toggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        margin: 7px 0 9px;
        padding: 9px 13px;
        border: 1px solid rgba(83, 65, 52, .24);
        border-radius: 999px;
        color: var(--ink);
        background: rgba(255, 255, 255, .14);
        font-family: var(--clean);
        font-size: 10px;
        font-weight: 500;
        letter-spacing: .12em;
        text-transform: uppercase;
        cursor: pointer;
      }

      .burger-lines,
      .burger-lines::before,
      .burger-lines::after {
        display: block;
        width: 17px;
        height: 1px;
        background: var(--ink);
        transition: transform .22s ease;
      }

      .burger-lines { position: relative; }
      .burger-lines::before,
      .burger-lines::after { content: ""; position: absolute; left: 0; }
      .burger-lines::before { top: -5px; }
      .burger-lines::after { top: 5px; }
      .menu-toggle[aria-expanded="true"] .burger-lines { background: transparent; }
      .menu-toggle[aria-expanded="true"] .burger-lines::before { transform: translateY(5px) rotate(45deg); }
      .menu-toggle[aria-expanded="true"] .burger-lines::after { transform: translateY(-5px) rotate(-45deg); }

      .mobile-menu {
        display: grid;
        grid-template-rows: 0fr;
        overflow: hidden;
        margin: 0 auto;
        transition: grid-template-rows .26s ease;
      }

      .mobile-menu.open { grid-template-rows: 1fr; }
      .mobile-menu-inner { min-height: 0; display: grid; }

      .mobile-menu a {
        padding: 13px 10px;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: .12em;
        text-transform: uppercase;
        border-bottom: 1px solid rgba(68, 53, 43, .12);
      }

      .mobile-menu a:last-child { border-bottom: 0; }
      main { padding: 52px 0 64px; }
      .page-intro { margin-bottom: 30px; }
      .page-intro h1 { font-size: 67px; }
      .page-intro::after { margin-top: 19px; }

      .about-photo {
        width: min(100%, 420px);
        aspect-ratio: 4 / 5;
        margin-bottom: 35px;
      }

      .about-copy { max-width: 100%; }
      .about-copy p { margin-bottom: 22px; font-size: 14px; line-height: 1.85; }
      .about-copy .highlight { margin-bottom: 26px; font-size: 42px; }
      .about-copy .wedding-quote { margin-top: 29px; padding-top: 26px; font-size: 42px; }
      .about-copy .brands { margin-top: 29px; padding-top: 24px; font-size: 12px; }
      .gold-dust-layer { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition: none !important; animation: none !important; }
      .reveal { opacity: 1; transform: none; }
      .gold-dust-layer { display: none; }
    }
  </style>
</head>
